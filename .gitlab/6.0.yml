.rules_6_0:
  rules:
    - if: $DISABLE_6_0 == "True"
      when: never

.binary_6_0:
  image: kitware/paraview_org-plugin-devel:6.0.1
  variables:
    PARAVIEW_VERSION: "6.0.1"

build_and_test_binary_compatible_6.0.1:
  extends:
    - .binary_compatible_gcc10
    - .binary_6_0
    - .build_and_test_binary_compatible
  rules:
    - !reference [".rules_binary_compatible", "rules"]
    - !reference [".rules_6_0", "rules"]
    - when: on_success
