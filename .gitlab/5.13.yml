.rules_5_13:
  rules:
    - if: $DISABLE_5_13 == "True"
      when: never
    - when: on_success

.binary_5_13:
  image: kitware/paraview_org-plugin-devel:5.13.3
  variables:
    PARAVIEW_VERSION: "5.13.3"

build_and_test_binary_compatible_5.13.3:
  extends:
    - .binary_compatible_devtoolset7
    - .build_and_test_binary_compatible
    - .binary_5_13
  rules:
    - !reference [".rules_binary_compatible", "rules"]
    - !reference [".rules_5_13", "rules"]
    - when: on_success
