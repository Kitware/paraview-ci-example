.binary_compatible_gcc10:
    variables:
        LAUNCHER: "scl enable gcc-toolset-10 --"
        LD_LIBRARY_PATH: "/.gitlab/qt6/lib/"

.binary_compatible_devtoolset7:
    variables:
        LAUNCHER: "scl enable devtoolset-7 --"
        XVFB_SETTINGS:  '-s "-screen 0 640x480x24"'

.rules_binary_compatible:        
  rules:
    - if: $DISABLE_BINARY == "True"
      when: never

.build_and_test_binary_compatible:
  stage: build
  script:
    - source /etc/os-release; if [[ "$VERSION" == "7 (Core)" ]]; then sed -i 's|mirror.centos.org|archive.kernel.org/centos-vault|g' /etc/yum.repos.d/*.repo; sed -i s/^#.*baseurl=http/baseurl=http/g /etc/yum.repos.d/*.repo; sed -i s/^mirrorlist=http/#mirrorlist=http/g /etc/yum.repos.d/*.repo; sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-*; sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://archive.kernel.org/centos-vault|g' /etc/yum.repos.d/CentOS-*; yum clean all; yum --disablerepo=ius makecache; yum --disablerepo=ius -y install xorg-x11-server-Xvfb xcb-util-keysyms xcb-util-wm libgfortran5; else yum -y install xorg-x11-server-Xvfb; fi
      # This is needed because the build of ParaView use some absolute path
    - ln -s /paraview/gitlab-kitware-sciviz-ci/ /builds/gitlab-kitware-sciviz-ci
    - mkdir -p build
    - cd build
    - $LAUNCHER cmake -DCMAKE_PREFIX_PATH=/builds/gitlab-kitware-sciviz-ci/build/install/ -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON ..
    - $LAUNCHER cmake --build . --parallel 2
    - xvfb-run $XVFB_SETTINGS ctest -j 2 --output-on-failure --no-tests=error || xvfb-run ctest -j 1 --rerun-failed --no-tests=error -VV
  tags:
    - docker
    - linux-x86_64
    - paraview
  artifacts:
    expire_in: 1h
    when: always
    paths:
      - build/
  interruptible: true

.build_plugin:
  stage: build
  script:
    - mkdir -p build
    - cd build
    - cmake -DCMAKE_PREFIX_PATH=/opt/paraview/install/ -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release ..
    - cmake --build . --parallel 2
  tags:
    - docker
    - linux-x86_64
    - paraview
  artifacts:
    expire_in: 1h
    when: always
    paths:
      - build/
  interruptible: true

.test_plugin:
  stage: test
  script:
    - cd build
    - xvfb-run ctest -j 2 --output-on-failure --no-tests=error || xvfb-run ctest -j 1 --rerun-failed --no-tests=error -VV
  tags:
    - docker
    - linux-x86_64
    - paraview
  artifacts:
    expire_in: 1h
    when: always
    paths:
      - build/
  interruptible: true
