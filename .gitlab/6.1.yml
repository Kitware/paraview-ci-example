.rules_6_1:
  rules:
    - if: $DISABLE_6_1 == "True"
      when: never

.binary_6_1:
  image: kitware/paraview_org-plugin-devel:6.1.1
  variables:
    PARAVIEW_VERSION: "6.1.1"

build_binary_compatible_6.1.1:
  extends:
    - .binary_compatible_gcc10
    - .binary_6_1
    - .build_binary_compatible
  rules:
    - !reference [".rules_binary_compatible", "rules"]
    - !reference [".rules_6_1", "rules"]
    - when: on_success

test_binary_compatible_6.1.1:
  extends:
    - .test_binary_compatible
    - .binary_6_1
  dependencies:
    - build_binary_compatible_6.1.1
  needs:
    - build_binary_compatible_6.1.1
  rules:
    - !reference [".rules_binary_compatible", "rules"]
    - !reference [".rules_6_1", "rules"]
    - when: on_success
